# Builds the zebrelina-patched Traccar image on every push to the `zebrelina` branch.
name: zebrelina image

on:
  push:
    branches: [zebrelina]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar and run the gl200 decoder test
        run: ./gradlew assemble test --tests org.traccar.protocol.Gl200TextProtocolDecoderTest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: zebrelina/Dockerfile
          push: true
          tags: |
            ghcr.io/moveable-ch/traccar:6.14.5-zebrelina.${{ github.run_number }}
            ghcr.io/moveable-ch/traccar:6.14.5-zebrelina
